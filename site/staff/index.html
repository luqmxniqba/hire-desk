<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#15171a">
<link rel="manifest" href="/staff/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="robots" content="noindex">
<script src="/config.js"></script>
<script src="/vendor/supabase.js"></script>

<style>
/* VOICE work: the back office of a small car hire firm, fast and exact, nothing decorative
   IDEA the key board behind a hire desk: every car is a key tag with its UK plate, an empty hook means it is out
   PICTURE the key board of tags on Today, and the availability planner: cars as rows, days across, hires as bars
   COLOUR white desk and tarmac night; tarmac rail for navigation; plate yellow for on hire and main actions; motorway blue for booked; red for late and clashes
   TYPE Barlow Condensed for plates, titles and figures + Barlow for text
   LAYOUT laptop: tarmac rail left, title row, then the picture, then two columns; phone: title, picture, lists, tab bar at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101113);--ink:light-dark(#141518,#f0f0ee);--mute:light-dark(#585c63,#a8acb3);--line:light-dark(#e0e1e3,#2d2f34);--line2:light-dark(#c9cbcf,#3d4046);--panel:light-dark(#f4f4f1,#18191c);--panel2:light-dark(#e9e9e5,#222428);--field:light-dark(#ffffff,#15161a);--rail:#15171a;--rail2:#23262b;--railink:#e6e7e9;--railmute:#9a9ea5;--y:#ffd400;--y2:#f2c900;--yink:#141414;--blue:light-dark(#0b4fb3,#7aafff);--bluefill:light-dark(#0b4fb3,#2f6bd3);--bluebg:light-dark(#e8f0fc,#16233a);--red:light-dark(#c4221a,#ff7466);--redfill:light-dark(#cf281e,#d6463a);--redbg:light-dark(#fdecea,#3a1815);--amber:light-dark(#8a4c00,#ffb84d);--amberbg:light-dark(#fff1d4,#372911);--r:10px;--head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overflow-x:clip}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.05;letter-spacing:-.01em}
h1{font-size:clamp(30px,4vw,42px);font-weight:700;text-wrap:balance}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mute{color:var(--mute)}
.small{font-size:14px}
.nw{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:var(--rail);color:var(--railink);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 22px/1 var(--head);letter-spacing:.01em;margin-right:auto;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:30px;height:30px;flex:none}
.searchbtn{display:flex;align-items:center;gap:10px;height:40px;width:min(380px,40vw);padding:0 12px;border-radius:8px;border:1px solid #33373d;background:var(--rail2);color:var(--railmute);text-align:left}
.searchbtn span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchbtn kbd{font:600 13px/1 Barlow,sans-serif;border:1px solid #44484f;border-radius:4px;padding:3px 6px}
.searchbtn:hover{color:#fff;border-color:#555a61}
.side{background:var(--rail);color:var(--railink);padding:8px 10px 24px;position:sticky;top:60px;height:calc(100vh - 60px);height:calc(100dvh - 60px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--railmute);text-decoration:none;font-weight:500}
.side a:hover{background:var(--rail2);color:#fff}
.side a[aria-current=page]{background:var(--rail2);color:#fff}
.side a[aria-current=page] .ic{color:var(--y)}
.side .count{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--redfill);color:#fff;font:600 13px/22px Barlow,sans-serif;text-align:center}
.side .count.soft{background:#3a3e45;color:#fff}
.side .foot{margin-top:auto;padding:16px 12px 0;color:var(--railmute);font-size:13px;line-height:1.4}
.main{min-width:0;padding-bottom:40px}
.view{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 24px}
.tabs{display:none}
.newbtn{flex:none}
@media(max-width:899px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
.bar{height:56px}
.side{display:none}
.searchbtn{width:44px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:var(--railink)}
.searchbtn span,.searchbtn kbd{display:none}
.newbtn span{display:none}
.newbtn{width:44px;padding:0;justify-content:center}
.main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.view{padding-top:18px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rail);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
.tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;color:var(--railmute);text-decoration:none;font:500 13px/1.1 Barlow,sans-serif;position:relative;border-radius:8px}
.tabs [aria-current=page]{color:#fff}
.tabs [aria-current=page] .ic{color:var(--y)}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--redfill);border:2px solid var(--rail)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:600 16px/1.2 Barlow,system-ui,sans-serif;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.iconbtn:focus-visible,.tag:focus-visible,a:focus-visible,.row:focus-visible,.bbar:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--y);border-color:var(--y);color:var(--yink)}
.btn.primary:hover{background:var(--y2);border-color:var(--y2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.danger:hover{border-color:var(--red)}
.btn.quiet{border-color:transparent;background:transparent;padding:0 10px}
.btn.quiet:hover{background:var(--panel)}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.bar .btn.primary:hover{background:#fff;border-color:#fff}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:inherit;flex:none}
.iconbtn:hover{background:var(--panel)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns.end{justify-content:flex-end}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.head .sub{color:var(--mute);margin-top:6px;font-size:16px}
.sec{margin-top:28px}
.sec>h2{margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 .mute{font:500 15px/1.2 Barlow,sans-serif}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.plate{display:inline-flex;align-items:stretch;background:var(--y);color:#111;border:1.5px solid #111;border-radius:4px;font:700 16px/1 var(--head);letter-spacing:.06em;white-space:nowrap;overflow:hidden;flex:none}
.plate b{font-weight:700;padding:5px 7px 4px 6px}
.plate i{display:flex;align-items:center;background:#1f43a8;color:#fff;font:600 9px/1 Barlow,sans-serif;font-style:normal;letter-spacing:.02em;padding:0 3px}
.plate.lg{font-size:24px}
.plate.lg b{padding:7px 10px 6px 8px}
.plate.lg i{font-size:11px;padding:0 4px}
.plate.ghost{background:transparent;color:var(--mute);border-style:dashed;border-color:var(--line2)}
.plate.ghost i{background:transparent;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;font:600 13px/1 Barlow,sans-serif;white-space:nowrap;background:var(--panel2);color:var(--ink);flex:none}
.pill.enquiry{background:transparent;border:1.5px dashed var(--line2);color:var(--mute)}
.pill.confirmed{background:var(--bluefill);color:#fff}
.pill.out{background:var(--y);color:var(--yink)}
.pill.overdue,.pill.red{background:var(--redfill);color:#fff}
.pill.returned{background:var(--ink);color:var(--bg)}
.pill.closed{background:var(--panel2);color:var(--mute)}
.pill.cancelled,.pill.noshow{background:transparent;color:var(--mute);text-decoration:line-through}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.pill.soft{background:var(--panel2);color:var(--ink)}
.pill.free{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.pill.offroad{background:repeating-linear-gradient(135deg,var(--panel2) 0 6px,transparent 6px 12px);border:1.5px solid var(--line2);color:var(--ink)}
.flag{color:var(--red);font-weight:600}
.warnline{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--amberbg);color:var(--amber);font-size:15px;font-weight:500}
.warnline.red{background:var(--redbg);color:var(--red)}
.warnline.info{background:var(--bluebg);color:var(--blue)}
.warnline .ic{margin-top:2px}
.warns{display:grid;gap:8px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px max(4vw,16px);font-size:15px;border-bottom:1px solid var(--line)}
.banner.y{background:var(--y);color:var(--yink);border-color:var(--y2)}
.banner.red{background:var(--redbg);color:var(--red)}
.banner.info{background:var(--panel);color:var(--ink)}
.banner p{flex:1 1 320px}
.banner .btn{min-height:36px}
.banner.y .btn{background:transparent;border-color:#141414;color:#141414}
.board-keys{position:relative;padding:26px 16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.keys{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:30px 14px}
@media(max-width:600px){.board-keys{padding:0;margin:0 calc(-1 * max(4vw,16px));border-radius:0;border-left:0;border-right:0}.keys{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(150px,44%);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:26px max(4vw,16px) 14px;gap:12px}.tag{scroll-snap-align:start;padding:24px 10px 10px;min-height:0;gap:4px}.tag .tm{font-size:14px}.tag .ts{font-size:13px}.tag .plate{font-size:14px}.tag .plate b{padding:4px 5px 3px 4px}}
.tag{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px 14px 14px;border-radius:12px 12px 14px 14px;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);min-height:132px;transform-origin:50% 0;transition:transform .25s ease}
.tag::before{content:'';position:absolute;top:-17px;left:50%;width:12px;height:19px;margin-left:-6px;background:radial-gradient(circle at 50% 5px,var(--mute) 3.5px,transparent 4.5px),linear-gradient(var(--line2),var(--line2)) 50% 8px/2px 11px no-repeat}
.tag::after{content:'';position:absolute;top:8px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--line2);background:var(--panel)}
.tag:hover{transform:rotate(-2deg)}
.tag .tm{font-weight:600;font-size:15px;line-height:1.25}
.tag .ts{font-size:14px;color:var(--mute);line-height:1.3}
.tag .ts b{color:var(--ink);font-weight:600}
.tag.out{background:transparent;border-style:dashed}
.tag.out .plate{background:transparent;color:var(--mute);border-style:dashed;border-color:var(--line2)}
.tag.out .plate i{background:transparent;color:var(--mute)}
.tag.out .tm{color:var(--mute)}
.tag.overdue{border:2px solid var(--red);background:var(--redbg)}
.tag.overdue .ts,.tag.overdue .ts b{color:var(--red)}
.tag.offroad{background:repeating-linear-gradient(135deg,var(--panel2) 0 8px,var(--bg) 8px 16px)}
.tag .state{margin-top:auto}
@media(prefers-reduced-motion:reduce){.tag,.tag:hover{transition:none;transform:none}.sheet{animation:none!important}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--bg);padding:14px 16px}
.kpi .k{font-size:14px;color:var(--mute)}
.kpi .v{font:700 clamp(26px,3vw,34px)/1.1 var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-size:14px;color:var(--mute)}
.kpi .v.red{color:var(--red)}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit;text-decoration:none}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--panel)}
.row .t{font-weight:600;line-height:1.3}
.row .s{font-size:14px;color:var(--mute);line-height:1.35}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .lead{display:flex;align-items:center}
.row.alert .lead .ic{color:var(--amber)}
.row.alert.red .lead .ic{color:var(--red)}
.row .acts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.empty{padding:22px 16px;text-align:center;color:var(--mute);border:1.5px dashed var(--line2);border-radius:var(--r)}
.empty p+p,.empty p+.btns{margin-top:10px}
.empty .btns{justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true],.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-weight:500;opacity:.75}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:8px;overflow:hidden;overflow-x:auto;flex:none;max-width:100%}
.seg button{flex:none;border:0;background:var(--bg);min-height:38px;padding:0 12px;font-weight:600;font-size:15px;color:var(--mute);white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line2);background:var(--field);font-size:16px;line-height:1.3}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);flex:none;margin:0}
.field{display:grid;gap:6px;align-content:start}
.field>span{font-size:14px;font-weight:600}
.field>small{font-size:13px;color:var(--mute)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.fgrid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.fset{border:0;padding:0;margin:0 0 20px;display:grid;gap:14px}
.fset>legend{font:600 19px/1.2 var(--head);padding:0;margin-bottom:12px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;font-size:16px}
.checks{display:grid;gap:2px}
.tick{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:16px}
.tick:hover{background:var(--panel)}
.tick .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.tick[aria-checked=true] .box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tick[aria-checked=true] .box .ic{width:16px;height:16px;stroke-width:3}
.tick[aria-checked=false] .box .ic{display:none}
.money{display:grid;gap:0;font-variant-numeric:tabular-nums}
.money .ml{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.money .ml:first-child{border-top:0}
.money .ml.tot{font-weight:700;font-size:18px}
.money .ml span:last-child{white-space:nowrap}
.money .ml.red span:last-child{color:var(--red);font-weight:700}
.summary{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.sbox{border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.sbox .big{font:700 30px/1 var(--head);font-variant-numeric:tabular-nums}
.layerbg{position:fixed;inset:0;background:rgba(10,11,13,.5);z-index:40;opacity:0;transition:opacity .15s}
.layerbg.on{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;top:50%;width:min(680px,calc(100vw - 32px));max-height:min(860px,calc(100vh - 48px));max-height:min(860px,calc(100dvh - 48px));transform:translate(-50%,-50%);display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border-radius:14px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28);animation:pop .16s ease-out}
.sheet.wide{width:min(920px,calc(100vw - 32px))}
.sheet.narrow{width:min(460px,calc(100vw - 32px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.sh-h{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line);flex:none}
.sh-h h2{flex:1;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b{padding:18px 20px 22px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.sh-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
.sh-f .grow{margin-right:auto}
@media(max-width:640px){
.sheet,.sheet.wide,.sheet.narrow{left:0;right:0;top:auto;bottom:0;width:100%;max-height:94vh;max-height:94dvh;transform:none;border-radius:16px 16px 0 0;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh-b{padding:16px 16px 20px}
.sh-f{padding:10px 16px max(10px,env(safe-area-inset-bottom))}
.sh-f .btn{flex:1 1 auto}
}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{color:var(--mute);font-size:15px}

async function retry(fn){
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const c = e && e.code;
      if ((c === 'resource_exhausted' || c === 'unavailable') && i < 5) { await sleep(500 * Math.pow(2, i) + Math.random() * 400); continue; }

}

}
function persist(col, id, obj){
  const key = col + '/' + id;

    if (S.mode === 'db') {

  p.then(() => { if (writes.get(key) === p) writes.delete(key); });
  return p;
}

}
function basePrice(car, start, end){
  const s = D(start), e = D(end);

  const days = hireDays(s.getTime(), e.getTime());

function quotePreset(p){

  if (p === 'weekend') { const f = nextDow(5, 17); const e = addDays(f, 2); return [f, e]; }
  if (p === 'long') { const f = nextDow(5, 17); const e = sod(addDays(f, 3)); e.setHours(10, 0, 0, 0); return [f, e]; }
  if (p === 'week') return [t, addDays(t, 7)];
  if (p === 'three') return [t, addDays(t, 3)];
  return [t, addDays(t, 1)];
}

function quoteRows(){

  const rows = activeCars().filter(c => (!q.cat || c.category === q.cat) && (!q.auto || /auto/i.test(c.transmission || '')) && (!q.seats || num(c.seats) >= num(q.seats))).map(c => {

function bookingWarnings(x){
  const b = x.b, car = x.car, cu = x.cust, W = [];
  const L = num(setting('licenceDays')), grace = num(setting('graceMins')) * MIN;
  if (x.overdue) W.push(warn(esc(dur(x.lateMs)) + ' late. It was due back ' + esc(fmtDT(b.end)) + '.', 'red'));
  if (x.rollDue) W.push(warn('The ' + rollWord(x.roll) + ' payment ' + (x.rollLate ? 'was due ' + esc(relDay(b.end)) : 'is due today') + '. Roll it on when they pay.', x.rollLate >= 2 ? 'red' : ''));
  for (const k of x.conflicts) {
    const other = k.c === b.id ? derive().B.get(k.a) : k.c ? derive().B.get(k.c) : null;
    const on = other ? esc((other.cust ? other.cust.name : '?') + ' (' + other.b.ref + ', ' + fmtDT(other.b.start) + ' to ' + fmtDT(other.b.end) + ')') : '';
    if (k.kind === 'clash') W.push(warn('Double-booked with ' + on + '.', 'red'));

function newRef(){
  const REFCH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const used = new Set([...S.bookings.values()].map(b => b.ref));
  for (let i = 0; i < 80; i++) { let r = ''; for (let j = 0; j < 4; j++) r += REFCH[Math.floor(Math.random() * REFCH.length)]; if (!used.has(r)) return r; }
  return Date.now().toString(36).slice(-5).toUpperCase();
}

async function shrinkImage(file, maxSide, q){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, (maxSide || 1600) / Math.max(w, h));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej({code: 'encode'}), 'image/jpeg', q || 0.74));
  } finally { URL.revokeObjectURL(url); }
}
function assetError(e){
  const c = e && e.code;
  if (c === 'quota_or_state') return 'Photo storage is full. Free up space in Setup, under Data tidy-up.';
  if (c === 'too_large') return 'That file is too big. The limit is 20 MB.';
  if (c === 'unsupported_type' || c === 'encode') return 'That kind of file can\'t be stored. Use a photo (JPEG or PNG) or a PDF.';
  if (c === 'rate_limited') return 'Too many uploads at once. Wait a moment and try again.';
  if (c === 'upstream_auth') return 'You\'ve been signed out. Reload the page or sign in again, then retry.';
  if (['not_granted', 'capability_disabled', 'capability_removed', 'no_assets', 'not_uploader'].includes(c)) return 'Saving photos needs you to be on this business\'s team.';
  return 'Couldn\'t save that. Check your connection and try again.';
}
async function storeUpload(file, kind){
  if (!CAP.assets) throw {code: 'no_assets'};
  let blob = file, type = file.type;
  if (type === 'application/pdf') { if (file.size > 20 * 1048576) throw {code: 'too_large'}; }
  else { blob = await shrinkImage(file, kind === 'doc' ? 2200 : 1600, kind === 'doc' ? 0.8 : 0.74); type = 'image/jpeg'; }
  let r;
  try { r = await CAP.assets.upload(blob, {type: type}); }
  catch (e) { if (e && e.code === 'store_unavailable') { await sleep(1200); r = await CAP.assets.upload(blob, {type: type}); } else throw e; }
  ASSET_URLS.set(r.id, r.url);
  return {id: r.id, type: type, size: r.sizeBytes};
}

function sigPadHTML(id){ return '<div class="sigpad"><canvas id="' + id + '" aria-label="Signature box"></canvas><span class="sigline">Sign here</span><button type="button" class="btn sm quiet sigclear" data-act="sig-clear" data-for="' + id + '">Clear</button></div>'; }
function sigPadInit(cv){
  if (!cv || cv._sig) return;
  const ratio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const fit = () => { const r = cv.getBoundingClientRect(); cv.width = Math.max(10, Math.round(r.width * ratio)); cv.height = Math.max(10, Math.round(r.height * ratio)); const g = cv.getContext('2d'); g.lineWidth = 2.4 * ratio; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; };
  fit(); cv._sig = {empty: true};

function depositFor(car, cust, start, excludeId){

const LOST_REASONS = ['Price', 'No car free', 'Car they wanted was taken', 'Dates changed', 'Went elsewhere', 'Stopped replying', 'Didn\'t meet our rules', 'Other'];
function cancelCalc(x){
  const pol = setting('cancellation') || {rules: []};
  const notice = (x.s - Date.now()) / DAY;
  const rules = (pol.rules || []).slice().sort((a, b) => num(b.days) - num(a.days));
  const rule = rules.find(rr => notice >= num(rr.days)) || rules[rules.length - 1] || {days: 0, pct: 0};
  const pays = (x.b.payments || []).filter(p => !['From deposit', 'Voucher'].includes(p.method) && num(p.amount) > 0);
  const back = sum((x.b.payments || []).filter(p => num(p.amount) < 0), p => p.amount);
  const fee = pol.keepFee ? sum(pays.filter(p => /booking fee|paid when booked/i.test(p.note || '')), p => p.amount) : 0;
  const paid = sum(pays, p => p.amount);
  const refundable = Math.max(0, r2((paid - fee) * num(rule.pct) / 100 + back));
  const vch = sum((x.b.payments || []).filter(p => p.method === 'Voucher'), p => p.amount);
  return {notice: notice, rule: rule, paid: paid, fee: fee, refundable: refundable, voucher: vch};
}

function shClashFix(id){
  const X = derive(); const x = X.B.get(id); if (!x) return;
  const pairs = x.conflicts.filter(k => k.kind === 'clash' || k.kind === 'offroad');
  if (!pairs.length) { toast('No clash on this booking now.'); return; }
  const now = Date.now(); const involved = new Set([id]); pairs.forEach(k => { involved.add(k.a); if (k.c) involved.add(k.c); });
  const movable = [...involved].map(i => X.B.get(i)).filter(v => v && (v.b.status === 'confirmed' || v.b.status === 'enquiry') && v.s > now);
  const opts2 = movable.map(v => {
    const cars = activeCars().filter(c => c.id !== v.b.carId && availability(c.id, v.b.start, v.b.end, v.b.id).ok && !(num(c.minAge) && v.cust && ageOn(v.cust.dob, v.b.start) != null && ageOn(v.cust.dob, v.b.start) < num(c.minAge)));
    cars.sort((a, b) => ((b.category === (v.car || {}).category) - (a.category === (v.car || {}).category)) || Math.abs(num((a.rates || {}).day) - num(((v.car || {}).rates || {}).day)) - Math.abs(num((b.rates || {}).day) - num(((v.car || {}).rates || {}).day)));
    return {v: v, cars: cars.slice(0, 5)};
  });
  const body = '<p class="hint" style="margin-bottom:12px">Move one of the bookings to a free car. The price stays as agreed, and a message is ready to send.</p>' +
    (opts2.length ? opts2.map(o => '<div class="blk"><h3>Move ' + esc(o.v.cust ? o.v.cust.name : 'this booking') + ' <span class="mute small">' + esc(o.v.b.ref + ' · ' + fmtDT(o.v.b.start) + ' to ' + fmtDT(o.v.b.end)) + '</span></h3>' +
      (o.cars.length ? '<div class="list">' + o.cars.map(c => { const same = c.category === (o.v.car || {}).category; const diff = num((c.rates || {}).day) - num(((o.v.car || {}).rates || {}).day);
        return '<div class="row"><span class="lead">' + plateHtml(c.plate) + '</span><span><span class="t">' + esc(carShort(c)) + '</span><span class="s">' + esc((same ? 'Same type' : (diff > 0 ? 'An upgrade' : 'Different type')) + ' · ' + money((c.rates || {}).day) + ' a day') + '</span></span><span class="r"><button type="button" class="btn sm primary" data-act="clash-move" data-id="' + esc(o.v.b.id) + '" data-car="' + esc(c.id) + '">Move here</button></span></div>'; }).join('') + '</div>' : '<p class="mute">No other car is free for those times.</p>') + '</div>').join('')
    : '<div class="empty">Neither booking can be moved here, because they have started already. Extend, swap the car on the live hire, or call the customer.</div>');
  openSheet({title: 'Fix the double booking', size: 'wide', body: body});
}

/* ---------- the send list ---------- */
function sendItems(){
  const X = derive(); const now = X.now; const items = [];
  const soon = sod(addDays(new Date(), 2)).getTime();
  const sentAt = (b, k) => b.msgs && b.msgs[k] ? TS(b.msgs[k]) || 0 : 0;
  const L = num(setting('licenceDays'));
  for (const x of X.B.values()) {
    const b = x.b, cu = x.cust; if (!cu) continue;
    const base = {x: x, b: b, cu: cu};
    if (b.status === 'confirmed' && x.s > now && x.s < soon) {
      if (!sentAt(b, 'pickup')) items.push(Object.assign({k: 'pickup', lv: 2, title: 'Pickup reminder to ' + firstName(cu.name), sub: carShort(x.car) + ' · collecting ' + whenShort(b.start)}, base));
      if (setting('formUrl') && (!cu.address || !cu.dob || !(cu.licence && cu.licence.number)) && !sentAt(b, 'form') && !sentAt(b, 'formIn')) items.push(Object.assign({k: 'form', lv: 3, title: 'Send ' + firstName(cu.name) + ' the booking form', sub: 'Missing ' + [!cu.address ? 'address' : '', !cu.dob ? 'date of birth' : '', !(cu.licence && cu.licence.number) ? 'licence number' : ''].filter(Boolean).join(', ')}, base));
      const chk = cu.licence && cu.licence.checkedAt;
      if ((!chk || daysFrom(chk) < -L) && !sentAt(b, 'checkcode') && !(cu.licence && cu.licence.code && cu.licence.codeAt && daysFrom(cu.licence.codeAt) > -21)) items.push(Object.assign({k: 'checkcode', lv: 3, title: 'Ask ' + firstName(cu.name) + ' for a DVLA check code', sub: chk ? 'Last checked ' + fmtD(chk) : 'Licence never checked'}, base));
    }
    if (x.roll && b.status === 'out' && x.e - now < DAY && sentAt(b, 'rollDue') < x.e - 3 * DAY) items.push(Object.assign({k: 'rollDue', lv: 1, title: 'Remind ' + (phCust(cu) ? 'the ' + (x.car ? x.car.plate : '') + ' hirer' : firstName(cu.name)) + ' their ' + rollWord(x.roll) + ' payment is due', sub: (x.car ? x.car.plate : '') + ' · due ' + whenShort(b.end)}, base));
    if (b.status === 'out' && !x.roll && !x.overdue && x.e > now && x.e < soon && !sentAt(b, 'return')) items.push(Object.assign({k: 'return', lv: 2, title: 'Return reminder to ' + firstName(cu.name), sub: carShort(x.car) + ' · due back ' + whenShort(b.end)}, base));
    if (x.overdue && now - sentAt(b, 'overdue') > 3 * HOUR) items.push(Object.assign({k: 'overdue', lv: 0, title: 'Chase ' + firstName(cu.name) + ', ' + dur(x.lateMs) + ' late', sub: carShort(x.car) + ' · was due ' + whenShort(b.end)}, base));
    const dep = b.deposit || {};
    if ((dep.status === 'returned' || dep.status === 'kept') && dep.settledAt && now - T(dep.settledAt) < 4 * DAY && !sentAt(b, 'depositBack') && !sentAt(b, 'depositDeduct')) items.push(Object.assign({k: num(dep.kept) > 0 ? 'depositDeduct' : 'depositBack', lv: 2, title: 'Tell ' + firstName(cu.name) + ' about their deposit', sub: money(dep.returned != null ? dep.returned : dep.amount) + ' sent back' + (num(dep.kept) ? ', ' + money(dep.kept) + ' kept' : '')}, base));
    if (b.status === 'closed' && x.balance > 0.004 && now - sentAt(b, 'owed') > 3 * DAY) items.push(Object.assign({k: 'owed', lv: 2, title: 'Chase ' + money(x.balance) + ' from ' + firstName(cu.name), sub: carShort(x.car) + ' · hire ended ' + fmtD(b.end)}, base));
    if (b.status === 'closed' && x.balance <= 0.004 && x.effEnd > now - 3 * DAY && !sentAt(b, 'thanks')) items.push(Object.assign({k: 'thanks', lv: 4, title: 'Thank ' + firstName(cu.name) + ' and ask for a shout-out', sub: carShort(x.car) + ' · back ' + fmtD(isoDay(new Date(x.effEnd)))}, base));
    if (b.status === 'enquiry' && x.s > now && !sentAt(b, 'quote') && now - (Date.parse(b.createdAt) || now) > 20 * MIN) items.push(Object.assign({k: 'quote', lv: 3, title: 'Send ' + firstName(cu.name) + ' a quote', sub: carShort(x.car) + ' · ' + whenShort(b.start)}, base));
  }
  for (const h of waitlistHits()) if (!h.lead.nudgedAt) items.push({k: 'waitlist', lv: 1, lead: h.lead, cars: h.cars, title: 'Good news for ' + firstName(h.lead.name) + ': a car is free', sub: carShort(h.cars[0]) + ' · ' + fmtDT(h.lead.start)});
  for (const f of S.fines.values()) if (f.status === 'transferred' && f.bookingId && !f.msgAt && S.bookings.get(f.bookingId)) items.push({k: 'fine', lv: 3, fine: f, b: S.bookings.get(f.bookingId), cu: S.customers.get(f.customerId), title: 'Tell ' + firstName((S.customers.get(f.customerId) || {}).name || 'the hirer') + ' about a ' + (f.kind || 'fine'), sub: ((S.cars.get(f.carId) || {}).plate || '') + ' · ' + fmtDT(f.at)});
  const rf = setting('referral') || {};
  if (rf.on) for (const c of S.customers.values()) {
    if (!c.referredBy || completedHires(c.id) < 1) continue; const by = S.customers.get(c.referredBy); if (!by || (by.referralThanks || []).includes(c.id)) continue;
    items.push({k: 'referral', lv: 4, cu: by, referred: c, title: 'Thank ' + firstName(by.name) + ' for sending ' + firstName(c.name), sub: money(rf.reward) + ' off their next hire'});
  }
  const wb = winbackList(); if (wb.length) items.push({k: 'winback', lv: 5, list: wb, title: plural(wb.length, 'regular') + ' to win back', sub: 'No hire for ' + (num(setting('winbackDays')) || 90) + '+ days'});
  return items.sort((a, b) => a.lv - b.lv);
}

    'The car is a ' + carName(car) + (isEV(car) ? ', fully electric' : '') + '. Its last recorded mileage was ' + (num(car.mileage) ? num(car.mileage) + ' miles' : 'not known') + '.';

async function readDashFromPhoto(form, file){

/* ---------- forecast ---------- */
function bookedIn(a, b, statuses){
  let v = 0, days = 0, paid = 0; const X = derive();
  for (const x of X.B.values()) {
    if (!statuses.includes(x.b.status)) continue;
    const durMs = Math.max(HOUR, x.e - x.s); const o = ov(x.s, x.e, a, b); if (!o) continue;
    v += (x.total + x.charges) * o / durMs; days += o / DAY; if (x.s >= a && x.s < b) paid += x.paid;
  }
  return {v: v, days: days, paid: paid};
}
function capacityDays(a, b){
  let d = 0;
  for (const c of activeCars()) { const off = offRange(c); let cap = (b - a) / DAY; if (off) cap -= ov(off.a, off.b, a, b) / DAY; d += Math.max(0, cap); }
  return d;
}
function carGaps(c, a, b, minDays){
  const X = derive(); const busy = [];
  for (const x of X.B.values()) { if (!['confirmed', 'out', 'enquiry'].includes(x.b.status)) continue; for (const sp of x.spans) if (sp.carId === c.id) busy.push([sp.s, sp.last ? x.effEnd : sp.e]); }
  const off = offRange(c); if (off) busy.push([off.a, off.b]);
  busy.sort((p, q) => p[0] - q[0]); const gaps = []; let t = a;
  for (const [s, e] of busy) { if (e <= t) continue; if (s > t && s - t >= minDays * DAY) gaps.push([t, Math.min(s, b)]); t = Math.max(t, e); if (t >= b) break; }
  if (b - t >= minDays * DAY) gaps.push([t, b]);
  return gaps.filter(g => g[1] - g[0] >= minDays * DAY);
}
function mForecast(){
  const cars = activeCars(); if (!cars.length) return emptyStart();
  const now = Date.now(); const st90 = stats(now - 90 * DAY, now); const avgDay = st90.perDay || sum(cars, c => num((c.rates || {}).day)) / cars.length;
  const win = n => { const b = bookedIn(now, now + n * DAY, ['confirmed', 'out']); const e = bookedIn(now, now + n * DAY, ['enquiry']); const cap = capacityDays(now, now + n * DAY); return {b: b, e: e, cap: cap, empty: Math.max(0, cap - b.days)}; };
  const w30 = win(30), w60 = win(60);
  const weeks = []; const wk0 = sod(new Date()).getTime();
  for (let i = 0; i < 8; i++) { const a = wk0 + i * 7 * DAY, b = a + 7 * DAY; const bb = bookedIn(Math.max(a, now), b, ['confirmed', 'out']); const ee = bookedIn(Math.max(a, now), b, ['enquiry']); const cap = capacityDays(Math.max(a, now), b); weeks.push({a: a, v: bb.v, e: ee.v, fill: cap ? bb.days / cap : 0}); }
  const mx = Math.max(1, ...weeks.map(w => w.v + w.e));
  const gaps = []; cars.forEach(c => carGaps(c, now, now + 14 * DAY, 2).forEach(g => gaps.push({c: c, a: g[0], b: g[1]})));
  gaps.sort((p, q) => (q.b - q.a) - (p.b - p.a));
  return '<div class="head"><div><h1>' + money0(w30.b.v) + ' booked for the next 30 days</h1><p class="sub">' + Math.round(w30.empty) + ' empty car-days still to fill. At your recent average of ' + money0(avgDay) + ' a hire day, filling half of them is ' + money0(w30.empty / 2 * avgDay) + ' more.</p></div></div>' +
    '<div class="kpis">' + kpi('Next 30 days', money0(w30.b.v), pctTxt(w30.cap ? w30.b.days / w30.cap : 0) + ' of car-days booked') + kpi('Next 60 days', money0(w60.b.v), pctTxt(w60.cap ? w60.b.days / w60.cap : 0) + ' booked') + kpi('Enquiries', money0(w60.e.v), 'not confirmed yet, next 60 days') + kpi('Empty car-days', String(Math.round(w30.empty)), 'next 30 days, across ' + plural(cars.length, 'car')) + '</div>' +
    '<section class="sec"><h2>Week by week</h2><div class="wkbars">' + weeks.map(w => '<div class="wk"><span class="wl">' + esc(fmtD(isoDay(new Date(w.a)), {nowd: true})) + '</span><span class="wb"><i class="e" style="width:' + (w.v / mx * 100) + '%"></i><i class="q" style="width:' + (w.e / mx * 100) + '%"></i></span><span class="wv num">' + money0(w.v) + (w.e ? ' <span class="mute">+ ' + money0(w.e) + '</span>' : '') + '</span><span class="wf mute small">' + pctTxt(w.fill) + ' full</span></div>').join('') + '</div>' +

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
function parseMoney(s){

  let neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /\bDR$/i.test(s); const n = parseFloat(s.replace(/[£$€,\s()]|CR$|DR$/gi, '').replace(/^-/, ''));

}
function parseBankDate(s){
  s = String(s || '').trim(); let m;

  if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s))) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
  if ((m = /^(\d{1,2})[ \-]([A-Za-z]{3})[A-Za-z]*[ \-](\d{2,4})/.exec(s))) { const mo = MO.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); let y = +m[3]; if (y < 100) y += 2000; if (mo >= 0) return y + '-' + pad(mo + 1) + '-' + pad(+m[1]); }
  return '';
}
function readStatement(text){
  const rows = parseCSV(text); if (rows.length < 2) return {err: 'That file has no rows in it.'};
  const hi = rows.slice(0, 12).findIndex(r => r.some(c => /date/i.test(c)));
  if (hi < 0) return {err: 'Couldn\'t find a Date column. Export the statement as a CSV from your banking app or website.'};
  const H = rows[hi].map(h => String(h).trim().toLowerCase());
  const find = re => H.findIndex(h => re.test(h));
  const di = find(/date/); const ai = find(/^(amount|value)\b|amount \(gbp\)|^amount/); const ii = find(/paid in|money in|credit|^in\b|in \(£\)/); const oi = find(/paid out|money out|debit|^out\b|out \(£\)/);
  const texts = H.map((h, i) => /desc|detail|memo|narrative|name|counter ?party|reference|payee|type|merchant/.test(h) && !/balance|account|sort/.test(h) ? i : -1).filter(i => i >= 0);
  if (ai < 0 && ii < 0) return {err: 'Couldn\'t find an amount column (Amount, Paid in or Credit).'};
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const date = parseBankDate(r[di]); if (!date) continue;
    let amt = ai >= 0 ? parseMoney(r[ai]) : null;
    if (amt == null) { const pin = ii >= 0 ? parseMoney(r[ii]) : null, pout = oi >= 0 ? parseMoney(r[oi]) : null; amt = pin ? Math.abs(pin) : pout ? -Math.abs(pout) : null; }
    if (amt == null || !amt) continue;
    out.push({date: date, amount: r2(amt), text: texts.map(i => r[i]).filter(Boolean).join(' · ').replace(/\s+/g, ' ').trim()});
  }
  return out.length ? {rows: out} : {err: 'No transactions found in that file.'};
}
function bankMatch(tx){
  const X = derive(); const t = T(tx.date); const txt = tx.text.toLowerCase(); let best = null;
  for (const x of X.B.values()) {
    if (['enquiry'].includes(x.b.status) && !x.paid) continue;
    let sc = 0; const why = [];
    if (x.b.ref && new RegExp('\\b' + x.b.ref.toLowerCase() + '\\b').test(txt)) { sc += 6; why.push('ref ' + x.b.ref); }
    const nm = x.cust ? x.cust.name.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z]/g, '')).filter(w => w.length > 1) : [];
    const has = w => w && new RegExp('\\b' + w + '\\b').test(txt);
    const first = has(nm[0]), last = nm.length > 1 && has(nm[nm.length - 1]);
    if (first && last) { sc += 4; why.push('name'); } else if (last) { sc += 1.5; why.push('surname'); } else if (first) { sc += 1; why.push('first name'); }
    const dep = num((x.b.deposit || {}).amount);
    if (Math.abs(tx.amount - x.balance) < 0.01 && x.balance > 0) { sc += 2; why.push('balance'); }
    else if (Math.abs(tx.amount - (x.total + x.charges)) < 0.01) { sc += 1.5; why.push('total'); }
    else if (dep && Math.abs(tx.amount - dep) < 0.01) { sc += 1; why.push('deposit'); }
    if (t >= x.s - 21 * DAY && t <= x.effEnd + 30 * DAY) sc += 1;
    if (sc >= 4 && (!best || sc > best.sc)) best = {x: x, sc: sc, why: why};
  }
  if (!best) return null;
  const pays = best.x.b.payments || []; const dep = best.x.b.deposit || {};
  best.recorded = pays.some(p => Math.abs(num(p.amount) - tx.amount) < 0.01 && Math.abs(T(p.date) - t) <= 5 * DAY) || (dep.status && dep.status !== 'none' && Math.abs(num(dep.amount) - tx.amount) < 0.01 && Math.abs(T(dep.heldAt || best.x.b.start) - t) <= 7 * DAY);
  best.isDep = dep && Math.abs(num(dep.amount) - tx.amount) < 0.01 && !Math.abs(tx.amount - best.x.balance) < 0.01;
  return best;
}

const CASH_KINDS = [['banked', 'Paid into the bank'], ['spent', 'Spent from the cash'], ['added', 'Added to the cash'], ['count', 'Counted the cash']];
function cashMoves(){
  const L = [];
  for (const b of S.bookings.values()) {
    const cu = S.customers.get(b.customerId); const who = (cu ? firstName(cu.name) : '') + ' ' + (b.ref || '');
    for (const p of b.payments || []) if (p.method === 'Cash') L.push({t: T(p.date), date: p.date, amt: num(p.amount), what: (num(p.amount) < 0 ? 'Refund to ' : 'Paid by ') + who, src: 'booking', id: b.id});
    const d = b.deposit || {};
    if (d.method === 'Cash' && d.heldAt && num(d.amount)) L.push({t: T(d.heldAt), date: isoDay(D(d.heldAt)), amt: num(d.amount), what: 'Deposit from ' + who, src: 'booking', id: b.id});
    if ((d.refundMethod || d.method) === 'Cash' && d.settledAt && num(d.returned)) L.push({t: T(d.settledAt), date: isoDay(D(d.settledAt)), amt: -num(d.returned), what: 'Deposit back to ' + who, src: 'booking', id: b.id});
  }
  for (const v of S.vouchers.values()) if (v.sold && v.sold.method === 'Cash' && num(v.sold.amount)) L.push({t: T(v.sold.date), date: v.sold.date, amt: num(v.sold.amount), what: 'Gift voucher ' + v.code, src: 'voucher'});
  for (const c of S.cashbook.values()) L.push({t: T(c.date), date: c.date, amt: c.kind === 'count' ? 0 : c.kind === 'added' ? num(c.amount) : -num(c.amount), what: (CASH_KINDS.find(k => k[0] === c.kind) || ['', ''])[1] + (c.notes ? ': ' + c.notes : ''), src: 'cash', id: c.id, count: c.kind === 'count' ? num(c.amount) : null});
  L.sort((a, b) => a.t - b.t || (a.count != null) - (b.count != null));
  let bal = 0; for (const m of L) { bal += m.amt; m.bal = bal; if (m.count != null) m.diff = r2(m.count - bal); }
  return L;
}

  for (const l of S.leads.values()) { if (TS(l.createdAt) < since) continue; const p = get(l.source || 'Other'); p.enq++; if (l.status === 'lost') p.lost++; }

  for (const e of S.expenses.values()) { if (e.category !== 'Marketing' || T(e.date) < since) continue; const hit = SOURCES.find(s => new RegExp(s, 'i').test((e.supplier || '') + ' ' + (e.notes || ''))); if (hit) get(hit).spend += num(e.amount); }
  const rows = Object.values(plat).map(p => Object.assign(p, {net: p.rev - p.spend, conv: p.enq ? p.booked / p.enq : 0})).sort((a, b) => b.net - a.net);
  const top = rows[0], busiest = rows.slice().sort((a, b) => b.enq - a.enq)[0];

  const pUse = code => { const L = [...X.B.values()].filter(x => x.b.promo === code && EARNING.includes(x.b.status)); return {n: L.length, rev: sum(L, x => x.total + x.charges), disc: sum(L, x => num(((x.b.pricing || {}).promo || {}).amount))}; };

  return '<div class="head"><div><h1>' + (top && top.net > 0 ? esc(top.src) + ' brings in the most: ' + money0(top.net) : 'Where your bookings come from') + '</h1><p class="sub">' + (busiest && top && busiest.src !== top.src ? esc(busiest.src) + ' sends the most messages, but ' + esc(top.src) + ' brings the most money. ' : '') + 'Set the platform on each booking, and use a promo code per post to see which ones work.</p></div>' +

function askContext(){
  const now = new Date(); const L = [];
  const cars = [...S.cars.values()].sort(carOrder);
  L.push('CARS (plate | car | type | day rate | status):'); const X = derive();
  cars.forEach(c => L.push([c.plate, carName(c), c.category, money((c.rates || {}).day), c.sold ? 'sold ' + (c.soldOn || '') : (X.C.get(c.id) || {}).state].join(' | ')));
  L.push('\nEARNED PER CAR PER MONTH (hire income for days on hire, by month):');
  const months = []; for (let i = 12; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  L.push('plate | ' + months.map(d => MO[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2)).join(' | '));
  const ms = months.map(d => stats(d.getTime(), new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime()));
  cars.forEach(c => L.push(c.plate + ' | ' + ms.map(s => Math.round((s.cars.get(c.id) || {earned: 0}).earned)).join(' | ')));
  L.push('TOTAL | ' + ms.map(s => Math.round(s.earned)).join(' | '));
  L.push('COSTS | ' + ms.map(s => Math.round(s.costs)).join(' | '));
  L.push('\nBOOKINGS, newest first (ref | plate | customer | from | to | status | total | paid | owed | source):');
  [...X.B.values()].sort((a, b) => b.s - a.s).slice(0, 450).forEach(x => L.push([x.b.ref, x.car ? x.car.plate : '', x.cust ? x.cust.name : '', isoDT(new Date(x.s)), isoDT(new Date(x.e)), STATUS[x.state] || x.b.status, Math.round(x.total + x.charges), Math.round(x.paid), Math.round(Math.max(0, x.balance)), x.b.source || ''].join(' | ')));
  const cs = custStats();
  L.push('\nCUSTOMERS by spend (name | hires | spent | owes | last hire):');
  [...S.customers.values()].map(c => [c, cs.get(c.id) || noCustStats]).sort((a, b) => b[1].spent - a[1].spent).slice(0, 200).forEach(([c, s]) => L.push([c.name, s.hires, Math.round(s.spent), Math.round(s.owes), s.last ? isoDay(new Date(s.last)) : ''].join(' | ')));
  L.push('\nSPENDING by month and type:');

function tidyCandidates(){
  const yrs = num(setting('retentionYears')) || 3; const cut = Date.now() - yrs * 365 * DAY; const cs = custStats();
  const old = [...S.customers.values()].filter(c => {
    if (c.anonymised) return false; const s = cs.get(c.id) || noCustStats;
    const lastAny = Math.max(s.last || 0, s.next ? s.next.s : 0, TS(c.createdAt) || 0);
    if (lastAny > cut || s.owes > 0.004 || s.next) return false;
    if ([...S.fines.values()].some(f => f.customerId === c.id && ['new', 'paid', 'transferred'].includes(f.status) && TS(f.updatedAt || f.at) > Date.now() - 365 * DAY)) return false;
    return true;
  });
  const pd = num(setting('photoKeepDays')) || 120; const pcut = Date.now() - pd * DAY;
  const openDamage = new Set([...S.damage.values()].filter(d => d.status !== 'Repaired' && d.bookingId).map(d => d.bookingId));
  const photoBks = [...S.bookings.values()].filter(b => (photoCount(b.photos && b.photos.out) || photoCount(b.photos && b.photos.in)) && ['closed', 'cancelled', 'noshow'].includes(b.status) && T((b.in && b.in.at) || b.end) < pcut && !openDamage.has(b.id) && !(derive().B.get(b.id) || {balance: 0}).balance);
  return {old: old, photoBks: photoBks, yrs: yrs, pd: pd};
}

function fleetFilter(){ return Object.assign({q: '', st: 'all', cat: '', sort: 'plate'}, UI.fleet || {}); }

  const X = derive(); const F = fleetFilter(); const q = F.q.trim().toLowerCase(); const qd = q.replace(/\s/g, '');

  if (F.cat) cars = cars.filter(c => c.category === F.cat);
  const st = c => (X.C.get(c.id) || {}).state;
  if (F.st === 'free') cars = cars.filter(c => st(c) === 'free');
  else if (F.st === 'out') cars = cars.filter(c => st(c) === 'out' || st(c) === 'overdue');
  else if (F.st === 'offroad') cars = cars.filter(c => st(c) === 'offroad');
  else if (F.st === 'prep') cars = cars.filter(c => prepList(c).length);
  else if (F.st === 'due') cars = cars.filter(c => (X.C.get(c.id) || {due: []}).due.some(d => d.level !== 'ok'));
  if (F.sort === 'earned' || F.sort === 'util') { const m = periodRange('month'); const s = stats(m.a, m.b); cars.sort((a, b) => ((s.cars.get(b.id) || {})[F.sort === 'earned' ? 'earned' : 'util'] || 0) - ((s.cars.get(a.id) || {})[F.sort === 'earned' ? 'earned' : 'util'] || 0)); }

/* ---------- rolling hires: paid weekly or monthly until the car comes back ---------- */
const WDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function addPeriod(iso, every, n, dom){
  const d = D(iso); if (!d) return iso; n = n || 1;

    x.setDate(Math.min(want, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));

  if (every === 'month') return Math.max(1, Math.round((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() + (b.getDate() - a.getDate()) / 30));
  return Math.max(1, Math.round((b - a) / (7 * DAY)));
}

function rollDayText(r, end){
  const day = r.day != null && r.day !== '' ? num(r.day) : rollDayOf(end, r.every);
  return r.every === 'month' ? 'pays on the ' + ordinal(day || 1) : 'pays ' + WDAYS[day || 0] + 's';
}
const periodWord = r => r && r.every === 'month' ? 'month' : 'week';
function rollSummary(x){
  const r = x.roll; if (!r) return '';
  return (r.every === 'month' ? 'Monthly' : 'Weekly') + ' rolling hire · ' + rollDayText(r, x.b.end) + (num(r.rate) ? ' · ' + money(r.rate) + ' a ' + periodWord(r) : '') + ' · paid up to ' + fmtD(x.b.end);
}
/* what the price is when a booking is rolling: the rate for each period it covers */
function rollPriceOpts(f, base){
  if (!f.rollEvery) return base;
  return Object.assign({}, base, {mode: 'manual', manual: r2(num(f.rollRate) * periodsBetween(f.start, f.end, f.rollEvery))});
}

    chk('ro-paid', 'paid', true, 'They\'ve paid it') + '<div id="ro-mw">' + fld('Paid by', sel('ro-m', 'method', PAYMETHODS, 'Cash')) + '</div>' +
    '<div id="ro-sum" class="sbox" style="margin-top:12px"></div></div></form>';

    mount: (el, sh, first) => { if (first) roUpdate($('#ro', el)); }});

function roUpdate(form){
  const x = derive().B.get(form.dataset.id); if (!x || !x.roll) return;
  const f = formData(form); const n = Math.max(1, num(f.n)); const amt = r2(num(f.amount) * n);

  $('#ro-sum', form).innerHTML = '<p>Paid up to <b>' + esc(fmtD(addPeriod(x.b.end, x.roll.every, n, x.roll.every === 'month' ? num(x.roll.day) || null : null))) + '</b> after this.</p>' +

async function saveRollOn(form){

async function saveRollEdit(form){

  const b = clone(ex); b.start = f.start;
  let msg;
  if (f.stop) {
    if (!(T(f.back) > T(f.start))) { toast('Pick when it\'s coming back.'); return; }
    delete b.rolling; b.end = f.back; msg = 'Rolling hire ending, car back ' + fmtDT(f.back);
  } else {
    b.end = f.end; b.rolling = {every: f.every, rate: num(f.rate), day: rollDayOf(f.end, f.every)};

async function restoreFile(file){

  if (!data || data.app !== 'car-hire-tracker') { toast('That file isn\'t a backup from this tracker.'); return; }
  const items = []; COLS.forEach(c => (data[c] || []).forEach(o => { if (o && o.id) items.push([c, o]); }));
  const ok = await confirmDlg({title: 'Restore this backup?', text: 'It has ' + plural(items.length, 'record') + (data.exportedAt ? ', saved ' + esc(fmtD(isoDay(new Date(data.exportedAt)), {year: true})) : '') + '. Records that match are replaced. Nothing else is deleted.', ok: 'Restore'});
  if (!ok) return;
  await bulk(items, p => put(p[0], p[1]), 'Restoring');
  if (data.settings) await saveSettings(window.PLATFORM && S.mode === 'db' ? window.PLATFORM.fixSettings(data.settings) : data.settings);

}
function renewDue(id, k){
  const car = clone(S.cars.get(id)); if (!car) return; const before = clone(car);
  const cur = D(car.due && car.due[k]);
  const base = cur && cur > addDays(new Date(), -60) ? cur : new Date();
  const next = isoDay(addMonths(base, 12));
  car.due = Object.assign({}, car.due); car.due[k] = next;
  if (k === 'service' && num(car.mileage)) car.due.serviceMiles = Math.round((num(car.mileage) + 10000) / 100) * 100;
  put('cars', car);
  toast((DUE_KEYS.find(z => z[0] === k) || [k, k])[1] + ' now due ' + fmtD(next, {year: true}), {undo: () => put('cars', before)});
}

/* ---------- forms ---------- */
function saveSettingsForm(form, keys, numeric){
  const f = formData(form); const patch = {};
  keys.forEach(k => { patch[k] = numeric ? num(f[k]) : f[k]; });
  return saveSettings(patch).then(ok => { if (ok) toast('Saved'); });
}
const FORMS = {
  booking: saveBookingForm, handover: saveHandover, checkin: saveCheckin, settle: saveSettle, payment: savePayment, charge: saveCharge, deposit: saveDeposit,
  extend: saveExtend, car: saveCar, offroad: saveOffRoad, customer: saveCustomer, fine: saveFine, expense: saveExpense, damage: saveDamage,
  'set-biz': f => saveSettingsForm(f, ['businessName', 'phone', 'email', 'address', 'pickupPlace']),
  'set-rules': f => saveSettingsForm(f, ['graceMins', 'turnaroundHrs', 'lateFeePerHour', 'fuelPerEighth', 'fineAdminFee', 'youngAge', 'dueSoonDays', 'licenceDays'], true),
  'set-extras': form => {
    const extras = $$('[data-extra]', form).map(row => {
      const t = $('input[type=text]', row), a = $('input[type=number]', row), p = $('input[type=checkbox]', row);
      return t && t.value.trim() ? {label: t.value.trim(), amount: num(a && a.value), perDay: !!(p && p.checked)} : null;
    }).filter(Boolean);
    return saveSettings({extras: extras}).then(ok => { if (ok) { toast('Extras saved'); renderView(true); } });
  },
  'set-tpl': form => {
    const t = {};
    TEMPLATES.forEach(z => { const el = form.elements['t_' + z.id]; const v = el ? el.value : ''; if (v.trim() && v.trim() !== z.text.trim()) t[z.id] = v; });
    return saveSettings({templates: t}).then(ok => { if (ok) toast('Wording saved'); });
  },
  'set-terms': form => { const f = formData(form); return saveSettings({terms: f.terms, liability: f.liability}).then(ok => { if (ok) toast('Agreement wording saved'); }); },
  quote: () => {}
};
Object.assign(ACT, EXT.act); Object.assign(FORMS, EXT.form); Object.assign(VIEWS, EXT.view); Object.assign(PARTIAL, EXT.partial);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const fn = ACT[act]; if (!fn) return;
  if (el.tagName === 'INPUT' && el.type === 'file') return;
  if (el.tagName === 'A' && act !== 'go' && !el.dataset.track) return;
  const sh = SHEETS.find(s => s.el.contains(el));
  if (sh && sh.o.menu && act !== 'close-sheet') closeSheet(sh);
  if (el.classList.contains('btrack') && e.target.closest('.bbar')) return;
  fn(el, e);
});
document.addEventListener('submit', async e => {
  const form = e.target; const fn = FORMS[form.dataset.form]; if (!fn) return;
  e.preventDefault();
  if (form._busy) return; form._busy = true;
  const btn = document.querySelector('[form="' + form.id + '"][type=submit]') || form.querySelector('[type=submit]');
  if (btn) btn.disabled = true;
  try { await fn(form); } catch (err) { console.error(err); toast('Something went wrong saving that.'); }
  finally { form._busy = false; if (btn && document.contains(btn)) btn.disabled = false; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'bk-q') { UI.bk.q = t.value; UI.bk.n = 60; $('#bklist').innerHTML = bookingList(); return; }
  if (t.id === 'cu-q') { UI.cu.q = t.value; UI.cu.n = 80; $('#culist').innerHTML = custList(); return; }
  if (t.id === 'sq') { $('#sres').innerHTML = searchResults(t.value); return; }
  if (t.id === 'm-b') { UI.msg.b = t.value; renderView(true); return; }
  for (const h of EXT.input) if (h(t) === true) return;
  const form = t.form || t.closest('form'); if (!form) return;
  switch (form.dataset.form) {
    case 'quote': { const f = formData(form); Object.assign(ensureQuote(), {start: f.start, end: f.end, cat: f.cat, seats: f.seats, age: f.age, auto: !!f.auto}); $('#qres').innerHTML = quoteResults(); break; }
    case 'booking': if (t.id === 'bf-dep') form._dep = true; bfUpdate(form); break;
    case 'checkin': if (t.closest('#rf-sugg')) { if (t.type === 'number') t.dataset.touched = '1'; } else rfUpdate(form); break;
    case 'settle': sfUpdate(form); break;
    case 'extend': xfUpdate(form); break;
    case 'fine': if (t.id === 'ff-dl') form._dl = true; ffUpdate(form, t.name); break;
    case 'offroad': ofUpdate(form); break;
    case 'charge': if (t.id === 'cf-p') $('#cf-l', form).value = t.value; break;
    case 'damage': if (t.id === 'gf-car') {
      const bks = bookingsFor(x => x.b.carId === t.value && x.b.status !== 'cancelled').sort((a, b) => b.s - a.s).slice(0, 20);
      $('#gf-b', form).innerHTML = opts([['', 'Not during a hire'], ...bks.map(x => [x.b.id, (x.cust ? x.cust.name : '?') + ' · ' + fmtD(x.b.start)])], '');
    } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restore-file' && t.files && t.files[0]) { const f = t.files[0]; t.value = ''; restoreFile(f); }
  if (t.id === 'cr-plate') t.value = normPlate(t.value);
  for (const h of EXT.change) if (h(t) === true) return;
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (viewDirty && !(a && $('#view').contains(a) && a.matches('input,textarea,select'))) renderView();
    for (const sh of SHEETS) if (sh.dirty && !(a && sh.el.contains(a) && a.matches('input,textarea,select'))) paintSheet(sh, false);
  }, 0);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SHEETS.length) { e.preventDefault(); ACT['close-sheet'](); return; }
  if (e.key === 'Enter' && e.target.id === 'sq') { e.preventDefault(); const f = $('#sres [data-act]'); if (f) setTimeout(() => f.click(), 0); return; }
  const typing = e.target.matches && e.target.matches('input,textarea,select,[contenteditable]');
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !ready()) return;
  if (e.key === '/' && !SHEETS.length) { e.preventDefault(); shSearch(); }
  else if ((e.key === 'n' || e.key === 'N') && !SHEETS.length) { e.preventDefault(); shBookingForm(null); }
  else if ((e.key === 'p' || e.key === 'P') && !SHEETS.length) { e.preventDefault(); shPasteChat(); }
  else if ((e.key === 'a' || e.key === 'A') && !SHEETS.length && aiOn()) { e.preventDefault(); shAsk(''); }
});
document.addEventListener('focusin', e => {
  const sh = topSheet();
  if (sh && !sh.el.contains(e.target) && !$('#toast').contains(e.target)) { const f = sh.el.querySelector('button,input,select,textarea,a[href]'); if (f) f.focus({preventScroll: true}); }
});

/* ---------- start ---------- */
async function waitClaude(ms){
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (window.claude && typeof window.claude.use === 'function') return window.claude; await sleep(40); }
  return window.claude && typeof window.claude.use === 'function' ? window.claude : null;
}
async function boot(){
  loadUI();
  onChange = schedule;
  window.addEventListener('hashchange', route);
  route();
  setInterval(() => { if (!document.hidden && ready()) { DV.at = -1; renderChrome(); renderView(); publicTick(); } }, 60000);
  let lastW = 0;
  if (window.ResizeObserver) {
    const viewRO = new ResizeObserver(() => { const w = $('#view').clientWidth; if (Math.abs(w - lastW) > 24) { lastW = w; if (UI.view === 'board') schedule(); } });
    viewRO.observe($('#view'));
  }
  if (window.PLATFORM) window.PLATFORM.attach({bump: bump, toast: toast});
  const cl = window.PLATFORM ? await window.PLATFORM.ready : await waitClaude(1500);
  if (window.PLATFORM && cl) { BOOK_URL = window.PLATFORM.bookingUrl(); FORM_URL = window.PLATFORM.formUrl(); }
  if (cl) {
    const safe = n => Promise.resolve().then(() => cl.use(n)).catch(() => null);
    const got = await Promise.all([safe('db'), safe('user'), safe('downloads')]);
    USER = got[1]; DOWN = got[2];
    Promise.all([safe('sample'), safe('assets'), safe('dictation')]).then(async more => {
      CAP.sample = more[0] || null; CAP.assets = more[1] || null; CAP.dictation = more[2] || null;
      if (CAP.sample && CAP.sample.limits) { try { const lim = await CAP.sample.limits(); CAP.sampleImages = !!(lim && lim.images); CAP.imgLimits = lim && lim.images; } catch (e) { CAP.sampleImages = false; } }
      if (CAP.dictation && typeof setupDictation === 'function') setupDictation();
      bump();
    });
    if (got[0]) { startDb(got[0]); return; }
  }
  startLocal();
}
boot();
