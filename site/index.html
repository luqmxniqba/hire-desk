<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hire Desk</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#15171a">
<script src="/config.js"></script>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15171a;color:#f0f0ee;font:17px/1.5 Barlow,system-ui,sans-serif;padding:24px}
.c{max-width:440px}
.b{display:flex;align-items:center;gap:12px;font:700 26px/1 'Barlow Condensed',Barlow,sans-serif}
.b img{width:44px;height:44px}
h1{font:700 40px/1.05 'Barlow Condensed',Barlow,sans-serif;margin:26px 0 10px}
p{color:#b9bcc2;margin:0 0 26px}
a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:10px;font:700 18px/1 Barlow,sans-serif;text-decoration:none;margin-bottom:10px}
.p{background:#ffd400;color:#141414}
.s{border:1.5px solid #3d4046;color:#f0f0ee}
a:focus-visible{outline:3px solid #7aafff;outline-offset:2px}
</style>
</head>
<body>
<main class="c">
  <div class="b"><img src="/icon.svg" alt=""><span id="n">Hire Desk</span></div>
  <h1>The back office for car hire firms</h1>
  <p>Bookings, fleet, deposits, fines and customers in one place, with a booking page your customers can use from their phone.</p>
  <a class="p" href="/staff">Staff sign in</a>
  <a class="s" href="/staff?demo">Try the demo</a>
</main>
<script>
var n = (window.APP_CONFIG || {}).platformName; if (n) { document.getElementById('n').textContent = n; document.title = n; }
</script>
</body>
</html>
